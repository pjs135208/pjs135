kind = "web"
previewPath = "/"
title = "박준서 | 게임 개발자 포트폴리오"
description = "박준서님의 게임 개발자 포트폴리오. 개인 프로필, 실제로 입력된 기술과 프로젝트, 활동 및 연락처를 보여주는 반응형 정적 웹사이트이며 GitHub Pages 배포를 지원합니다."
version = "1.0.0"
id = "artifacts/junseo-game-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20158

[services.development]
run = "pnpm --filter @workspace/junseo-game-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/junseo-game-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/junseo-game-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20158"
BASE_PATH = "/"
